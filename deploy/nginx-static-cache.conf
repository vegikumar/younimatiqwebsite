# Apply to /etc/nginx/nginx.conf inside the http { } block (gzip section):
#   gzip_vary on;
#   gzip_proxied any;
#   gzip_comp_level 6;
#   gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/ttf font/otf application/font-woff application/font-woff2;
#
# Apply site static caching by merging younimatiq-static.conf into the server block.

location ~* ^/build/assets/.+\.(js|css|woff2?|ttf|otf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location ~* ^/(images|math_assets|minecraft_assets|robotics_assets|wp_assets|community_videos)/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
}

location = /logo.png {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
}

location ~* ^/(favicon\.ico|favicon-32x32\.png|apple-touch-icon\.png|site\.webmanifest)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
}
