<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Friendship Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&display=swap">
<style>
/* Layout: lesson-slide look (near-black, purple glow, lime). Tree house picture on the left, one question + five big friend cards on the right. Single dark look by choice. */
:root{
  --bg:#0d0b14; --panel:#17131f; --line:#2d2540; --purple:#7b4bd6; --glow:rgba(123,75,214,.35);
  --lime:#8dc63f; --fg:#f4f2f7; --muted:#b5abc6; --bad:#ff6b5a; --gold:#ffd04a;
  --display:"Anton","Impact","Arial Narrow",sans-serif; --body:"Montserrat",system-ui,sans-serif;
  color-scheme:dark;
}
body{background:radial-gradient(ellipse at 85% 0%,var(--glow),transparent 55%),var(--bg);background-color:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,58px);line-height:.95;margin:0;text-transform:uppercase}
h1 span{color:var(--lime);display:block}
.rule{width:120px;height:5px;background:var(--purple);margin-top:10px}
.sub{color:var(--muted);margin:10px 0 0;font-weight:600}
.count{font-family:var(--display);font-size:22px;background:var(--panel);border:2px solid var(--line);padding:8px 16px;letter-spacing:.5px}
.count b{color:var(--lime);font-weight:400}
.game{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:18px;align-items:start}
@media (max-width:820px){.game{grid-template-columns:1fr}}
.house{display:flex;flex-direction:column;gap:10px;min-width:0}
.view{border:3px solid var(--purple);box-shadow:0 0 30px var(--glow);background:#000;max-width:100%}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.built{font-weight:700;color:var(--muted);font-size:14px;min-height:20px}
.built b{color:var(--lime)}
.right{display:flex;flex-direction:column;gap:14px;min-width:0}
.q{background:linear-gradient(135deg,#221a35,#17131f);border:2px solid var(--purple);padding:18px;display:flex;flex-direction:column;gap:10px}
.q h2{margin:0;font-size:clamp(21px,3.4vw,28px);line-height:1.3;font-weight:800;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
.speak{align-self:flex-start;background:transparent;border:2px solid var(--line);padding:6px 10px;font-weight:700;font-size:13px}
.speak:hover{border-color:var(--lime)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:620px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--panel);border:2px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform .12s,border-color .12s;min-width:0}
.card:hover:not(:disabled){transform:translateY(-4px);border-color:var(--lime)}
.card:focus-visible,.btn:focus-visible,.speak:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.card:disabled{cursor:default}
.card.ok{border-color:var(--lime);background:#1d2a14}
.card.no{border-color:var(--bad);opacity:.5}
.av{width:52px;height:52px;display:grid;place-items:center;font-family:var(--display);font-size:30px;color:#0d0b14;box-shadow:inset -5px -5px 0 rgba(0,0,0,.25),inset 5px 5px 0 rgba(255,255,255,.25)}
.nm{font-family:var(--display);font-size:clamp(17px,1.8vw,22px);max-width:100%;overflow-wrap:anywhere;line-height:1;text-transform:uppercase;color:var(--lime)}
.skill{font-size:13px;font-weight:700;line-height:1.35;color:var(--fg)}
.fb{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);padding:14px 16px;line-height:1.5;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;min-height:56px}
.fb.good{border-left-color:var(--lime)} .fb.bad{border-left-color:var(--bad)}
.btn{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.8px;background:var(--lime);color:#0d0b14;border:0;padding:10px 22px;box-shadow:4px 4px 0 var(--purple)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--purple)}
.end h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);margin:0;line-height:1;text-transform:uppercase}
.end h2 span{color:var(--lime)}
.end p{margin:0;line-height:1.6}
.lesson{font-size:18px;font-weight:700;border-left:5px solid var(--lime);padding-left:14px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Friendship Quest<span>Build the Tree House</span></h1>
      <div class="rule"></div>
      <p class="sub">Pick the right friend. Every right answer builds the tree house!</p>
    </div>
    <div class="count">BUILT <b id="n">0</b>/8</div>
  </header>
  <div class="game">
    <div class="house">
      <div class="view"><canvas id="cv" width="160" height="140" aria-label="The tree house, built one part at a time"></canvas></div>
      <div class="built" id="built">Answer the first question to start building.</div>
    </div>
    <section class="right" id="stage" aria-live="polite"></section>
  </div>
</div>

<script>
const FRIENDS={
 Tyler:{c:"#8dc63f",s:"Brave hero, loves to explore"},
 Evan:{c:"#ffd04a",s:"Loyal, funny, great at building"},
 Grace:{c:"#5ec8f0",s:"Smart planner, solves puzzles"},
 Tobi:{c:"#ff8a4d",s:"Brave, quick thinker"},
 Candace:{c:"#e07bd8",s:"Creative, full of ideas"},
};
const ORDER=["Tyler","Evan","Grace","Tobi","Candace"];
const Q=[
 {q:"Who leads the friends with courage?",a:"Tyler",why:"Tyler is the brave hero.",part:"tree trunk"},
 {q:"Who can find a safe path through the forest?",a:"Grace",why:"Grace helps the group stay safe.",part:"leaves"},
 {q:"Who is the best at crafting and building?",a:"Evan",why:"Evan is an expert builder.",part:"floor"},
 {q:"Who has lots of creative ideas for the design?",a:"Candace",why:"Candace is creative and full of ideas.",part:"walls"},
 {q:"A creeper is coming! Who thinks fast?",a:"Tobi",why:"Tobi is a quick thinker.",part:"windows"},
 {q:"Everyone is sad. Who can make them laugh?",a:"Evan",why:"Evan brings humor to every challenge.",part:"door"},
 {q:"The roof needs a smart plan. Who is the best planner?",a:"Grace",why:"Grace is great at planning.",part:"roof"},
 {q:"Who loves to explore and climbs up first?",a:"Tyler",why:"Tyler is always ready to explore.",part:"ladder and flag"},
];
const $=s=>document.querySelector(s);
let i,built,firstTry,missed;

/* sound + voice */
let ac;function beep(f,d,v=.05,t="triangle"){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);const n=ac.currentTime;g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d)}catch(e){}}
const sOk=()=>[523,659,784].forEach((f,k)=>setTimeout(()=>beep(f,.14),k*90)),sBad=()=>beep(140,.22,.04,"sawtooth");
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.speak(u)}catch(e){}}

/* tree house drawing: parts appear as built goes 0..8 */
const cv=$("#cv"),cx=cv.getContext("2d"),T=5;
function b(x,y,a,d){cx.fillStyle=a;cx.fillRect(x,y,T,T);cx.fillStyle=d;cx.fillRect(x,y+T-1,T,1);cx.fillRect(x+T-1,y,1,T)}
function rect(c0,r0,w,h,a,d){for(let r=0;r<h;r++)for(let c=0;c<w;c++)b((c0+c)*T,(r0+r)*T,a,d)}
function draw(){
  const W=cv.width,H=cv.height;
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#2a1d4a");g.addColorStop(1,"#5b3f8f");cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.fillStyle="#fff";[[12,10],[40,22],[70,8],[120,16],[146,30],[100,34]].forEach(([x,y])=>cx.fillRect(x,y,1,1));
  cx.fillStyle="#f3e9a6";cx.fillRect(130,8,10,10);cx.fillRect(132,6,6,14);cx.fillRect(128,10,14,6);
  rect(0,25,32,1,"#5fae35","#4a8c28");rect(0,26,32,2,"#7a4e24","#5c3a1a");
  // 1 trunk (cols 15-16, rows 12-24)
  if(built>=1)rect(15,13,2,12,"#7a5230","#5c3c22");
  // 2 leaves around/behind
  if(built>=2){rect(8,4,16,5,"#3f9a2a","#2f7a1e");rect(6,6,4,3,"#3f9a2a","#2f7a1e");rect(22,6,4,3,"#3f9a2a","#2f7a1e");rect(10,2,12,2,"#4fb236","#3a8a25")}
  // 3 floor platform row 13
  if(built>=3)rect(9,13,14,1,"#b07a3e","#8a5a2a");
  // 4 walls rows 9-12
  if(built>=4)rect(10,9,12,4,"#c8955a","#9c6b3a");
  // 5 windows
  if(built>=5){[[11,10],[12,10],[19,10],[20,10]].forEach(([c,r])=>{cx.fillStyle="#ffd977";cx.fillRect(c*T,r*T,T,T*1)});}
  // 6 door
  if(built>=6)rect(15,10,2,3,"#5c3c22","#3e2814");
  // 7 roof
  if(built>=7){rect(9,8,14,1,"#b8432f","#8e3222");rect(10,7,12,1,"#b8432f","#8e3222");rect(12,6,8,1,"#b8432f","#8e3222");rect(14,5,4,1,"#b8432f","#8e3222")}
  // 8 ladder + flag
  if(built>=8){for(let r=14;r<25;r++){cx.fillStyle="#d9a066";cx.fillRect(21*T,r*T,1,T);cx.fillRect(22*T+3,r*T,1,T);cx.fillRect(21*T,r*T+2,T+4,1)}
    cx.fillStyle="#3e2814";cx.fillRect(16*T,1*T,1,4*T);cx.fillStyle="#8dc63f";cx.fillRect(16*T+1,1*T,10,6)}
  if(built===0){cx.fillStyle="rgba(255,255,255,.6)";cx.font="8px sans-serif";cx.textAlign="center";cx.fillText("Let's build!",W/2,H/2)}
}

function cardHTML(n){const F=FRIENDS[n];return `<button class="card" data-n="${n}"><div class="av" style="background:${F.c}">${n[0]}</div><div class="nm">${n}</div><div class="skill">${F.s}</div></button>`}
function start(){i=0;built=0;firstTry=0;missed=false;$("#n").textContent=0;$("#built").textContent="Answer the first question to start building.";draw();ask()}
function ask(){
  missed=false;const S=Q[i];
  $("#stage").innerHTML=`<div class="q"><h2>${S.q}</h2><button class="speak" id="spk">🔊 Read to me</button></div>
   <div class="cards">${ORDER.map(cardHTML).join("")}</div>
   <div class="fb" id="fb"><span>Tap a friend.</span></div>`;
  $("#spk").onclick=()=>say(S.q);
  $("#stage").querySelectorAll(".card").forEach(c=>c.onclick=()=>pick(c,S));
}
function pick(c,S){
  const fb=$("#fb");
  if(c.dataset.n===S.a){
    sOk();if(!missed)firstTry++;built++;$("#n").textContent=built;draw();
    $("#built").innerHTML=`You built the <b>${S.part}</b>!`;
    c.classList.add("ok");$("#stage").querySelectorAll(".card").forEach(x=>x.disabled=true);
    fb.className="fb good";fb.innerHTML=`<span><b>Yes!</b> ${S.why}</span><button class="btn" id="go">${i<Q.length-1?"Next ▶":"Finish ▶"}</button>`;
    $("#go").onclick=()=>{i++;i<Q.length?ask():finish()};$("#go").focus();
  }else{
    sBad();missed=true;c.classList.add("no");c.disabled=true;
    fb.className="fb bad";fb.innerHTML=`<span>Not ${c.dataset.n}. Read the cards and try again!</span>`;
  }
}
function finish(){
  [523,659,784,1046].forEach((f,k)=>setTimeout(()=>beep(f,.18,.06),k*110));
  $("#built").innerHTML=`<b>The tree house is finished!</b>`;
  const lesson="Courage, trust, and smart decisions help us survive unexpected problems.";
  $("#stage").innerHTML=`<div class="q end">
   <h2>Tree house <span>built!</span></h2>
   <p>You got <b>${firstTry} of ${Q.length}</b> right on the first try. Great teamwork!</p>
   <p class="lesson">${lesson}</p>
   <p><b>Say it:</b> "I am most like ___ because ___."</p>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="speak" id="spk">🔊 Read to me</button><button class="btn" id="again">Play again</button></div></div>`;
  $("#spk").onclick=()=>say(lesson);$("#again").onclick=start;$("#again").focus();
}
start();
</script>

</body></html>
