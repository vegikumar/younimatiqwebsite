<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Treasure Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3e3bf; --paper2:#e9d29f; --ink:#4a3418; --ink-soft:#7a5a32;
  --trail:#a0522d; --pin:#c0392b; --gold:#e6a817; --card:#fff8e8; --line:#c9a868;
  --who:#2e86de; --where:#27ae60; --next:#e67e22; --bg:#d9c08a; --shadow:rgba(74,52,24,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#3a2c1a; --paper2:#2f2414; --ink:#f3e3bf; --ink-soft:#d4b98a;
    --trail:#e0915a; --pin:#ff6b5a; --gold:#f5c542; --card:#4a3a24; --line:#7a5f38;
    --who:#5aa9f0; --where:#4cd17f; --next:#ffa24d; --bg:#1f170c; --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#3a2c1a; --paper2:#2f2414; --ink:#f3e3bf; --ink-soft:#d4b98a;
  --trail:#e0915a; --pin:#ff6b5a; --gold:#f5c542; --card:#4a3a24; --line:#7a5f38;
  --who:#5aa9f0; --where:#4cd17f; --next:#ffa24d; --bg:#1f170c; --shadow:rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;min-height:100vh;padding:24px 16px 60px}
.map{max-width:880px;margin:0 auto;background:radial-gradient(ellipse at 30% 20%,var(--paper) 0%,var(--paper2) 100%);
  border-radius:18px;padding:32px 24px 48px;position:relative;box-shadow:0 10px 40px var(--shadow),inset 0 0 60px rgba(120,80,30,.25);
  border:3px dashed var(--line)}
header{text-align:center;margin-bottom:8px}
h1{font-family:"Pirata One",serif;font-weight:400;font-size:clamp(2.4rem,7vw,3.8rem);margin:0;letter-spacing:1px;line-height:1}
.sub{color:var(--ink-soft);font-weight:700;margin:8px 0 0}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
.chip{font-weight:900;font-size:.85rem;padding:6px 12px;border-radius:999px;background:var(--card);border:2px solid currentColor}
.chip.who{color:var(--who)}.chip.where{color:var(--where)}.chip.next{color:var(--next)}
.compass{position:absolute;top:18px;right:20px;width:62px;height:62px;opacity:.75}
.trail{position:relative;margin-top:20px}
.stop{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.stop.right{flex-direction:row-reverse;text-align:right}
.conn{height:70px;position:relative}
.conn svg{position:absolute;inset:0;width:100%;height:100%}
.conn path{fill:none;stroke:var(--trail);stroke-width:4;stroke-dasharray:2 12;stroke-linecap:round}
.thumb{flex:0 0 auto;width:min(46vw,260px);aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:5px solid var(--card);
  box-shadow:0 6px 16px var(--shadow);cursor:pointer;position:relative;background:var(--paper2);transform:rotate(-2deg);transition:transform .2s}
.stop.right .thumb{transform:rotate(2deg)}
.thumb:hover{transform:rotate(0) scale(1.03)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.locked img{filter:grayscale(1) blur(3px) brightness(.8)}
.thumb .lock{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:2.4rem}
.thumb.locked .lock{display:flex}
.info{flex:1;min-width:0}
.pin{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--pin);color:#fff;
  font-family:"Pirata One",serif;font-size:1.6rem;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.done .pin{background:var(--where)}
.info h2{font-family:"Pirata One",serif;font-weight:400;font-size:1.8rem;margin:6px 0 2px}
.info p{margin:0;color:var(--ink-soft);font-weight:700}
.go{margin-top:10px;font:inherit;font-weight:900;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.treasure{margin-top:10px;text-align:center}
.chest{font-size:4rem;cursor:pointer;display:inline-block;filter:drop-shadow(0 6px 8px var(--shadow));transition:transform .2s}
.chest.locked{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.chest:not(.locked){animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.xmark{font-family:"Pirata One",serif;font-size:2.6rem;color:var(--pin);line-height:1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,12,4,.7);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:10}
.modal.open{display:flex}
.sheet{background:var(--paper);color:var(--ink);border-radius:18px;max-width:900px;width:100%;padding:22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.close{position:absolute;top:10px;right:12px;font-size:1.6rem;background:none;border:0;color:var(--ink);cursor:pointer}
.sheet h3{font-family:"Pirata One",serif;font-weight:400;font-size:2.2rem;margin:0 36px 4px 0}
.sheet .lead{margin:0 0 14px;font-weight:700;color:var(--ink-soft)}
.big{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:var(--paper2);display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.qcard{background:var(--card);border-radius:14px;padding:14px;border-top:6px solid var(--c)}
.qcard h4{margin:0 0 6px;font-size:1.25rem;color:var(--c);font-weight:900}
.qcard .starter{font-size:1.15rem;font-weight:800;margin:0 0 8px}
.qcard .hint{font-size:.95rem;font-weight:600;color:var(--ink-soft);display:none;margin:6px 0 0;padding:8px;border-radius:8px;background:var(--paper2)}
.qcard.show .hint{display:block}
.peek{font:inherit;font-size:.8rem;font-weight:800;background:none;border:2px solid var(--c);color:var(--c);border-radius:999px;padding:3px 10px;cursor:pointer}
.qcard.who{--c:var(--who)}.qcard.where{--c:var(--where)}.qcard.next{--c:var(--next)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-weight:900;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;background:var(--pin);color:#fff}
.story{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.story div{background:var(--card);border-radius:12px;padding:12px;font-weight:800;text-align:center}
.story span{display:block;font-family:"Pirata One",serif;font-size:1.5rem;color:var(--pin);font-weight:400}
.reset{display:block;margin:28px auto 0;font:inherit;font-weight:800;background:none;border:2px solid var(--ink-soft);color:var(--ink-soft);border-radius:999px;padding:6px 14px;cursor:pointer}
@media (max-width:640px){
  .stop,.stop.right{flex-direction:column;text-align:center}
  .thumb{width:100%;max-width:340px}
  .cards,.story{grid-template-columns:1fr}
  .story{grid-template-columns:1fr 1fr}
  .compass{display:none}
  .map{padding:26px 14px 40px}
}
.stars{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-weight:900;font-size:1.2rem;background:var(--card);padding:8px 16px;border-radius:999px;box-shadow:0 3px 0 var(--line)}
.thumb .tag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-weight:900;font-size:.85rem;padding:4px 10px;border-radius:999px}
.q{background:var(--card);border-radius:16px;padding:14px;border-left:8px solid var(--c);margin-top:14px}
.q.who{--c:var(--who)}.q.where{--c:var(--where)}.q.next{--c:var(--next)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead h4{margin:0;font-size:1.4rem;font-weight:900;color:var(--c)}
.qhead .starter{font-size:1.2rem;font-weight:800}
.say{font:inherit;font-size:1.1rem;background:none;border:2px solid var(--c);color:var(--c);border-radius:999px;width:40px;height:40px;cursor:pointer;margin-left:auto}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.choice{font:inherit;font-weight:800;font-size:1.05rem;background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.choice .em{font-size:2.4rem;line-height:1}
.choice:hover{transform:translateY(-3px)}
.choice.right{border-color:var(--where);background:color-mix(in srgb,var(--where) 18%,var(--paper))}
.choice.wrong{opacity:.45;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{margin:10px 0 0;font-weight:900;font-size:1.15rem;min-height:1.4em}
.feedback.good{color:var(--where)}.feedback.try{color:var(--next)}
@media (max-width:640px){.choices{grid-template-columns:1fr}.choice{flex-direction:row;justify-content:flex-start;padding:10px 14px}.choice .em{font-size:2rem}}
</style>
</head>
<body>
<div class="map">
  <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="3"/>
    <polygon points="50,8 58,50 50,92 42,50" fill="currentColor"/>
    <polygon points="8,50 50,42 92,50 50,58" fill="currentColor" opacity=".5"/>
  </svg>
  <header>
    <h1>The Story Treasure Map</h1>
    <p class="sub">Tap a picture. Look carefully. Then guess! 👀</p>
    <div class="legend">
      <span class="chip who">👤 WHO? "I can see…"</span>
      <span class="chip where">🌍 WHERE? "They are in…"</span>
      <span class="chip next">⭐ WHAT NEXT? "I think…"</span>
    </div>
    <div class="stars" id="stars">⭐ 0 / 18 stars</div>
  </header>
  <div class="trail" id="trail"></div>
  <div class="treasure">
    <div class="xmark">X</div>
    <div class="chest" id="chest" role="button" tabindex="0" aria-label="Open the treasure chest">🎁</div>
    <p class="sub">Tap the treasure at the end of the story!</p>
  </div>
  <button class="reset" id="reset">↺ Play again</button>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>

    el.className="stop"+(i%2?" right":"")+(d?" done":"");
    el.innerHTML=`
      <div class="thumb" data-i="${i}" role="button" tabindex="0" aria-label="Open stop ${i+1}">
        <img src="${IMG[s.img]}" alt="Picture from the book: ${s.title}"><span class="tag">Tap me! 👆</span>
      </div>
      <div class="info">
        <span class="pin">${d?"✓":i+1}</span>
        <h2>${s.title}</h2>
        <p>${d?"All 3 stars found! ⭐⭐⭐":"Who? Where? What next?"}</p>
        <button class="go" data-i="${i}">${d?"Look again 👀":"Let's guess! →"}</button>
      </div>`;
    trail.appendChild(el);
  });
  trail.querySelectorAll("[data-i]").forEach(b=>{
    const open=()=>openStop(+b.dataset.i);
    b.addEventListener("click",open);
    b.addEventListener("keydown",e=>{if(e.key==="Enter")open()});
  });
}
const modal=document.getElementById("modal"),sheet=document.getElementById("sheet");
function openStop(i){
  const s=STOPS[i];
  sheet.innerHTML=`<button class="close" aria-label="Close">✕</button>
   <h3>Stop ${i+1}: ${s.title}</h3><p class="lead">Look at the picture carefully… 👀</p>
   <img class="big" src="${IMG[s.img]}" alt="Picture from the book: ${s.title}">
   ${QS.map(([k,ic,label,starter])=>`
     <div class="q ${k}" data-k="${k}">
       <div class="qhead"><h4>${label} ${ic}</h4><span class="starter">"${starter}"</span>
         <button class="say" aria-label="Read aloud">🔊</button></div>
       <div class="choices">${s[k].map((c,j)=>`<button class="choice" data-j="${j}"><span class="em">${c[0]}</span><span>${c[1]}</span></button>`).join("")}</div>
       <p class="feedback"></p>
     </div>`).join("")}
   <div class="actions">
     ${i<STOPS.length-1?`<button class="btn" id="nextStop">Next stop ➜</button>`:`<button class="btn" id="toTreasure">Open the treasure 🎁</button>`}
   </div>`;
  sheet.querySelector(".close").onclick=closeM;
  const nb=sheet.querySelector("#nextStop"); if(nb) nb.onclick=()=>openStop(i+1);
  const tb=sheet.querySelector("#toTreasure"); if(tb) tb.onclick=openTreasure;
  sheet.querySelectorAll(".q").forEach(qEl=>{
    const k=qEl.dataset.k, q=QS.find(x=>x[0]===k), fb=qEl.querySelector(".feedback");
    qEl.querySelector(".say").onclick=()=>speak(q[4]+" "+s[k].map(c=>c[1]).join(", or, "));
    if(got[i+k]){ // already answered: show it
      s[k].forEach((c,j)=>{ if(k==="next"? got[i+k]===j+1 : c[2]) qEl.querySelector(`[data-j="${j}"]`).classList.add("right")});
      fb.className="feedback good"; fb.textContent=k==="next"?"✨ "+s.answer:"⭐ "+q[3].replace("…"," ")+s[k].find(c=>c[2]).at(1).toLowerCase()+".";
    }
    qEl.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{
      const j=+btn.dataset.j, c=s[k][j];
      if(k==="next"){
        qEl.querySelectorAll(".choice").forEach(b=>b.classList.remove("right"));
        btn.classList.add("right"); got[i+k]=j+1;
        fb.className="feedback good"; fb.textContent="Great guess! ✨ "+s.answer; speak("Great guess! "+s.answer.replace(/[^\w\s!.,']/g,""));
      } else if(c[2]){
        btn.classList.add("right"); got[i+k]=1;
        const p=PRAISE[Math.floor(Math.random()*PRAISE.length)];
        const line=q[3].replace("…"," ")+c[1].toLowerCase()+".";
        fb.className="feedback good"; fb.textContent=p+" "+line; speak(p.replace(/[^\w\s!.,']/g,"")+" "+line);
      } else {
        btn.classList.remove("wrong"); void btn.offsetWidth; btn.classList.add("wrong");
        fb.className="feedback try"; fb.textContent="Hmm, look again! Try another one 🔍"; speak("Hmm, look again!");
      }
      save(); render();
    });
  });
  modal.classList.add("open"); modal.scrollTop=0;
}
function openTreasure(){
  sheet.innerHTML=`<button class="close" aria-label="Close">✕</button>
   <h3>🎉 You found the treasure!</h3><p class="lead">The friends beat the dragon. Everyone is happy. Fireworks! 🎆 You have ${count()} of 18 stars.</p>
   <img class="big" src="${IMG.c69}" alt="Fireworks over the town">
   <p class="lead" style="margin-top:16px">Now tell the story to a friend: 🗣️</p>
   <div class="story"><div><span>First</span>🏠 new house</div><div><span>Then</span>🧱 game world</div><div><span>Next</span>💥 BOOM!</div><div><span>Finally</span>🐉 the dragon</div></div>
   <div class="actions"><button class="btn" id="fin">Back to the map 🗺️</button></div>`;
  sheet.querySelector(".close").onclick=closeM;sheet.querySelector("#fin").onclick=closeM;
  modal.classList.add("open"); modal.scrollTop=0; speak("You found the treasure! Hooray!");
}
function closeM(){modal.classList.remove("open");try{speechSynthesis.cancel()}catch(e){}}
modal.addEventListener("click",e=>{if(e.target===modal)closeM()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
const chest=document.getElementById("chest");
chest.addEventListener("click",openTreasure);
chest.addEventListener("keydown",e=>{if(e.key==="Enter")openTreasure()});
document.getElementById("reset").onclick=()=>{got={};save();render()};
render();
</script>
</body>
</html>
